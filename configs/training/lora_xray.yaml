# =============================================================================
# LoRA Training Config — X-ray (SD 2.1 on CheXpert + MIMIC-CXR)
# =============================================================================

experiment_name: xray_lora_chexpert

model:
  backbone: stabilityai/stable-diffusion-2-1
  lora:
    rank: 16
    alpha: 32
    target_modules: [to_q, to_k, to_v, to_out.0]
    dropout: 0.1
    bias: none

training:
  epochs: 50
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  max_grad_norm: 1.0
  fp16: true
  gradient_checkpointing: true
  use_8bit_adam: true
  seed: 42

data:
  dataset: chexpert
  image_size: 512
  num_workers: 4

scheduler:
  type: cosine
  num_cycles: 1

logging:
  log_every_n_steps: 50
  save_every_n_epochs: 5
  validation_every_n_epochs: 5

cfg:
  unconditional_dropout: 0.10    # 10% CFG unconditional training
