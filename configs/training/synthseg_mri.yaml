# =============================================================================
# SynthSeg + Contrast Synthesis Training Config — MRI
# =============================================================================

experiment_name: mri_contrast_synthesis

synthseg:
  atlas_source: freesurfer      # freesurfer | standalone
  generation_params:
    n_labels: 37                 # Number of tissue classes
    randomize_resolution: true
    data_augmentation: true

contrast_synthesis:
  model_type: conditional_diffusion   # conditional_diffusion | pix2pix_cgan
  in_channels: 37                     # One-hot label map
  out_channels: 1
  contrast_tokens: [t1, t2, flair, dwi, swi, asl]

training:
  epochs: 80
  batch_size: 4
  learning_rate: 2.0e-4
  fp16: true
  use_8bit_adam: true

data:
  datasets: [brats2023, adni, ixi]
  image_size: 256

loss:
  l1_weight: 10.0
  perceptual_weight: 1.0
  adversarial_weight: 1.0       # For cGAN mode only
